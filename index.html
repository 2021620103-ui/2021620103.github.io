<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="서울과 제주의 날씨, Google 검색, 오늘의 명언을 담은 시작 페이지" />
    <title>오늘의 시작</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="오늘의 시작 홈">
          <span class="brand-mark" aria-hidden="true">
            <i class="blue"></i><i class="red"></i><i class="yellow"></i><i class="green"></i>
          </span>
          <span>오늘의 시작</span>
        </a>
        <time id="headerDate" class="header-date"></time>
      </header>

      <section class="hero" aria-labelledby="greeting">
        <p class="eyebrow">START YOUR DAY</p>
        <h1 id="greeting">좋은 아침이에요.</h1>
        <p class="hero-copy">오늘 필요한 정보와 영감을 한곳에서 만나보세요.</p>

        <form class="search" action="https://www.google.com/search" method="get" role="search">
          <label class="sr-only" for="searchInput">Google 검색</label>
          <span class="search-icon" aria-hidden="true"></span>
          <input id="searchInput" name="q" type="search" placeholder="Google에서 검색" autocomplete="off" autofocus />
          <button type="submit" aria-label="검색하기">검색</button>
        </form>
        <p class="shortcut-hint"><kbd>/</kbd> 키를 눌러 바로 검색</p>
      </section>

      <section class="content-grid" aria-label="오늘의 정보">
        <article class="card weather-card">
          <div class="card-heading">
            <div>
              <p class="card-label">WEATHER</p>
              <h2>오늘의 날씨</h2>
            </div>
            <button id="refreshWeather" class="icon-button" type="button" aria-label="날씨 새로고침" title="날씨 새로고침">
              <span aria-hidden="true">↻</span>
            </button>
          </div>
          <div id="weatherList" class="weather-list" aria-live="polite">
            <div class="weather-item is-loading"><div class="weather-icon skeleton"></div><div class="weather-copy"><span class="skeleton line short"></span><span class="skeleton line"></span></div></div>
            <div class="weather-item is-loading"><div class="weather-icon skeleton"></div><div class="weather-copy"><span class="skeleton line short"></span><span class="skeleton line"></span></div></div>
          </div>
          <p id="weatherUpdated" class="weather-updated">날씨 정보를 불러오는 중이에요.</p>
        </article>

        <article class="card quote-card">
          <div class="quote-mark" aria-hidden="true">“</div>
          <div>
            <p class="card-label">DAILY INSPIRATION</p>
            <blockquote id="quoteText"></blockquote>
            <p id="quoteAuthor" class="quote-author"></p>
          </div>
          <button id="nextQuote" class="text-button" type="button">다른 명언 보기 <span aria-hidden="true">→</span></button>
        </article>
      </section>
    </main>
    <footer>작은 시작이 좋은 하루를 만듭니다.</footer>
    <script src="script.js"></script>
  </body>
</html>
